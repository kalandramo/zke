<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="same-origin" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>ZKE 生产桌面（夹具）</title>
    <script>
      // 与 index.html / desktop-trial.html 同一套主题键：首帧之前定下 data-theme，
      // 免得深色偏好下先闪一帧浅色桌面。这一页挂的是真实的 desktop/Desktop.tsx，
      // 它的主题守卫读的也是这个键。
      try {
        const stored = localStorage.getItem("zke.theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme =
          stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/desktop-prod/main.tsx"></script>
  </body>
</html>
