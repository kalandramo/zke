version: '3'

# Windows-friendly equivalents of the Makefile targets.
#
# The Makefile remains the source of truth for Linux/CI; when adding or
# changing a target, keep the two in sync. Tasks marked "Git Bash" call the
# hack/*.sh scripts and need bash on PATH (Git for Windows provides it).

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo development
  GO_LDFLAGS: '-X github.com/togettoyou/zke/pkg/shared/buildinfo.version={{.VERSION}}'
  BUF_VERSION: 'v1.72.0'

tasks:
  default:
    desc: fmt → vet → lint → test（等价 Makefile 的 all）
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  fmt:
    desc: go fmt ./...
    cmds:
      - go fmt ./...

  fmt-check:
    desc: 检查 cmd/pkg/api 是否存在未格式化的 Go 文件
    cmds:
      - cmd: |
          unformatted="$(gofmt -l cmd pkg api)"
          test -z "$unformatted" || { echo "gofmt required for:"; echo "$unformatted"; exit 1; }

  vet:
    desc: go vet ./...
    cmds:
      - go vet ./...

  lint:
    desc: golangci-lint run
    cmds:
      - cmd: |
          command -v golangci-lint >/dev/null 2>&1 || { echo "golangci-lint is not installed; see https://golangci-lint.run"; exit 1; }
          golangci-lint run

  test:
    desc: go test ./...
    cmds:
      - go test ./...

  test-race:
    desc: go test -race ./...
    cmds:
      - go test -race ./...

  test-integration:
    desc: 含 PostgreSQL 集成测试（需要 ZKE_TEST_DATABASE_URL）
    env:
      ZKE_TEST_DATABASE_URL: '{{.ZKE_TEST_DATABASE_URL}}'
    preconditions:
      - sh: test -n "$ZKE_TEST_DATABASE_URL"
        msg: set ZKE_TEST_DATABASE_URL to a disposable PostgreSQL database
    cmds:
      - go test ./... -count=1

  build:
    desc: go build ./...（版本号写入 buildinfo）
    cmds:
      - go build -ldflags="{{.GO_LDFLAGS}}" ./...

  build-server:
    desc: 构建发布形二进制 bin/zke-server
    cmds:
      - go build -trimpath -ldflags="-s -w {{.GO_LDFLAGS}}" -o bin/zke-server{{exeExt}} ./cmd/zke-server

  build-agent:
    desc: 构建发布形二进制 bin/zke-agent
    cmds:
      - go build -trimpath -ldflags="-s -w {{.GO_LDFLAGS}}" -o bin/zke-agent{{exeExt}} ./cmd/zke-agent

  version:
    desc: 输出当前版本号
    cmds:
      - echo {{.VERSION}}

  run-server:
    desc: 本地启动 zke-server = 构建 + 运行两步（前提：本地 PostgreSQL 匹配 configs/zke-server.yaml 的默认 DSN）
    cmds:
      - task: run-server:build
      - task: run-server:run

  run-server:build:
    desc: 构建 zke-server 开发二进制 bin/zke-server-dev（编译错误在这一步暴露，不带发布形裁剪）
    cmds:
      - go build -o bin/zke-server-dev{{exeExt}} ./cmd/zke-server

  run-server:run:
    desc: 直接运行已构建的 bin/zke-server-dev，不重新编译；改完代码先跑 run-server:build
    cmds:
      - ./bin/zke-server-dev{{exeExt}} --config configs/zke-server-local.yaml

  run-agent:
    desc: 本地启动 zke-agent
    cmds:
      - go run ./cmd/zke-agent --config configs/zke-agent.yaml

  console:dev:
    desc: Console Vite 开发服务器
    dir: web/console
    cmds:
      - pnpm dev

  console:build:
    desc: 构建 Console 产物
    dir: web/console
    cmds:
      - pnpm build

  generate-agent-protocol:
    desc: 生成 Agent 协议 Go 源码（Git Bash + protoc 35.0）
    cmds:
      - bash ./hack/generate-agent-protocol.sh

  lint-agent-protocol:
    desc: buf lint（经 go run，跨平台）
    cmds:
      - go run github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}} lint

  check-agent-protocol:
    desc: 校验协议源码与生成结果一致（Git Bash）
    cmds:
      - bash ./hack/check-agent-protocol.sh

  breaking-agent-protocol:
    desc: buf breaking（需要 AGAINST=Git 引用）
    preconditions:
      - sh: test -n "$AGAINST"
        msg: set AGAINST to a Git reference
    cmds:
      - go run github.com/bufbuild/buf/cmd/buf@{{.BUF_VERSION}} breaking --against ".git#branch={{.AGAINST}}"
